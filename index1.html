<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎵 Escalas com repetição 4x (duração estendida)</title>
    <script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.4/build/cjs/vexflow.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container {
            background: white;
            border-radius: 25px;
            padding: 15px 12px;
            max-width: 950px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            position: relative;
        }
        h1 {
            text-align: center;
            color: #333;
            font-size: 1.4em;
            margin-bottom: 4px;
        }
        h1 span {
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .tonalidade-selector {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .tonalidade-selector label {
            font-weight: bold;
            color: #333;
            font-size: 0.9em;
        }
        .tonalidade-selector select {
            padding: 6px 12px;
            border-radius: 20px;
            border: 2px solid #667eea;
            background: white;
            font-size: 0.9em;
            font-weight: 500;
            color: #333;
            outline: none;
            cursor: pointer;
            transition: 0.2s;
        }
        .tonalidade-selector select:hover {
            border-color: #764ba2;
        }
        .info-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 8px;
            padding: 4px 10px;
            background: #f0f2ff;
            border-radius: 10px;
            font-weight: 500;
            color: #333;
            font-size: 0.8em;
        }
        .info-top .conjunto-label { color: #667eea; font-weight: bold; }
        .info-top .rodada { color: #FF9800; font-weight: bold; }
        .info-top .placar { color: #4CAF50; font-weight: bold; }
        .info-top .placar span.erros { color: #EF476F; }
        .partitura-container {
            background: #f8f9fa;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            padding: 4px 3px;
            min-height: 110px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: auto;
        }
        #notation {
            width: 100%;
            min-height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #notation svg {
            max-width: 100%;
            height: auto;
            display: block;
        }
        .status-bar {
            display: flex;
            justify-content: center;
            margin: 8px 0 4px;
            padding: 4px 8px;
            background: #f0f2ff;
            border-radius: 12px;
        }
        .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            width: 100%;
            justify-content: center;
        }
        .btn {
            border: none;
            padding: 10px 16px;
            border-radius: 30px;
            color: white;
            font-weight: bold;
            font-size: 0.9em;
            cursor: pointer;
            transition: all 0.2s;
            flex: 1 1 auto;
            min-width: 70px;
            text-align: center;
        }
        .btn:hover:not(:disabled) { transform: translateY(-2px); }
        .btn:active:not(:disabled) { transform: scale(0.95); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .btn-play { background: linear-gradient(135deg, #4CAF50, #45a049); box-shadow: 0 4px 15px rgba(76,175,80,0.3); }
        .btn-repeat { background: linear-gradient(135deg, #FF9800, #F57C00); box-shadow: 0 4px 15px rgba(255,152,0,0.3); }
        .legenda {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin: 8px 0 4px;
        }
        .nota-btn {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 5px 12px;
            border: 3px solid transparent;
            border-radius: 30px;
            font-weight: bold;
            font-size: 0.9em;
            background: #f8f9fa;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            user-select: none;
            flex: 0 1 auto;
        }
        .nota-btn .bola { display: inline-block; width: 14px; height: 14px; border-radius: 50%; border: 1px solid #ccc; }
        .nota-btn:hover:not(:disabled) { transform: scale(1.05); border-color: #667eea; }
        .nota-btn:active:not(:disabled) { transform: scale(0.95); }
        .nota-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
        .nota-btn.acertou { border-color: #4CAF50; background: #e8f5e9; transform: scale(1.05); }
        .nota-btn.errou { border-color: #EF476F; background: #fce4ec; transform: scale(0.95); animation: shake 0.3s; }
        .nota-btn.destaque { border-color: #FF9800; background: #fff3e0; box-shadow: 0 0 15px rgba(255,152,0,0.3); }
        @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }

        /* ===== FEEDBACK CENTRALIZADO (com suporte para ícone grande) ===== */
        .feedback {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2000;
            padding: 20px 40px;
            border-radius: 30px;
            font-size: 1.6em;
            font-weight: bold;
            text-align: center;
            max-width: 90%;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            border: 2px solid transparent;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(4px);
            color: white;
        }
        .feedback.sucesso { opacity: 1; background: white; color: #4CAF50; border-color: #4CAF50; backdrop-filter: none; }
        .feedback.erro { opacity: 1; background: rgba(0,0,0,0.85); color: #EF476F; border-color: #EF476F; backdrop-filter: blur(4px); }
        .feedback.info { opacity: 1; background: rgba(0,0,0,0.85); color: #667eea; border-color: #667eea; backdrop-filter: blur(4px); }
        .feedback.fim { opacity: 1; background: rgba(0,0,0,0.85); color: #FF9800; border-color: #FF9800; backdrop-filter: blur(4px); }
        .feedback.icone { opacity: 1; background: rgba(0,0,0,0.7); border-color: #ffd700; color: #ffd700; font-size: 5em; padding: 40px; backdrop-filter: blur(6px); border-width: 4px; }
        .feedback:not(.sucesso):not(.erro):not(.info):not(.fim):not(.icone) { opacity: 0; }

        /* Overlay de orientação */
        .orientation-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            flex-direction: column;
            color: white;
            font-size: 1.6em;
            text-align: center;
            padding: 30px;
            transition: opacity 0.5s;
            opacity: 0;
            pointer-events: none;
        }
        .orientation-overlay.show { opacity: 1; pointer-events: auto; }
        .orientation-overlay .icon { font-size: 4em; margin-bottom: 20px; animation: rotate-phone 2s ease-in-out infinite; }
        .orientation-overlay .sub { font-size: 0.6em; opacity: 0.8; margin-top: 15px; }
        @keyframes rotate-phone { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(90deg); } }
        @media (orientation: landscape) { .orientation-overlay { display: none; } }

        @media (max-width: 600px) {
            .container { padding: 10px 8px; }
            h1 { font-size: 1.2em; }
            .tonalidade-selector label { font-size: 0.8em; }
            .tonalidade-selector select { font-size: 0.8em; padding: 4px 10px; }
            .info-top { font-size: 0.7em; padding: 3px 6px; }
            .nota-btn { padding: 4px 10px; font-size: 0.8em; }
            .btn { padding: 8px 12px; font-size: 0.8em; min-width: 50px; }
            .feedback { font-size: 1.2em; padding: 15px 25px; }
            .feedback.icone { font-size: 3.5em; padding: 25px; }
            .partitura-container { min-height: 90px; padding: 3px 2px; }
            #notation { min-height: 80px; }
            .legenda { gap: 6px; }
            .orientation-overlay { font-size: 1.2em; }
        }
        @media (max-width: 400px) {
            .btn { font-size: 0.7em; padding: 6px 8px; min-width: 40px; }
            .nota-btn { font-size: 0.65em; padding: 3px 6px; }
            .info-top { font-size: 0.6em; }
            .feedback { font-size: 1em; padding: 12px 20px; }
            .feedback.icone { font-size: 2.8em; padding: 20px; }
        }
    </style>
</head>
<body>

<div class="orientation-overlay show" id="orientationOverlay">
    <div class="icon">📱</div>
    <div>Gire o celular para a posição <strong>horizontal</strong></div>
    <div class="sub">(ou clique para fechar)</div>
</div>

<div class="container">
    <h1>🎵 <span>Audição</span></h1>

    <div class="tonalidade-selector">
        <label for="tonalidadeSelect">🎼 Tonalidade:</label>
        <select id="tonalidadeSelect">
            <option value="Dó Maior">Dó Maior</option>
            <option value="Ré menor">Ré menor</option>
            <option value="Mi menor">Mi menor</option>
            <option value="Fá Maior">Fá Maior</option>
            <option value="Sol Maior">Sol Maior</option>
            <option value="Lá menor">Lá menor</option>
            <option value="Si diminuto">Si diminuto</option>
        </select>
    </div>

    <div class="info-top">
        <span>🎼 <span class="conjunto-label" id="conjuntoLabel">Dó Maior - Dó Mi Sol</span></span>
        <span>🔁 <span class="rodada" id="etapaLabel">1 / 100</span></span>
        <span class="placar">✅ <span id="acertosLabel">0</span> &nbsp;|&nbsp; <span class="erros">❌ <span id="errosLabel">0</span></span></span>
    </div>

    <div class="partitura-container">
        <div id="notation"></div>
    </div>

    <div class="status-bar">
        <div class="btn-group">
            <button class="btn btn-play" id="btnPlay">▶ Tocar</button>
            <button class="btn btn-repeat" id="btnRepeat" disabled>🔁 Repetir</button>
        </div>
    </div>

    <div class="feedback" id="feedbackMsg"></div>

    <div class="legenda" id="legenda"></div>

    <div class="info">🎼 Ouça a escala (cada nota 4 vezes) e adivinhe a nota!</div>
</div>

<script>
    // ============================================================
    //  DEFINIÇÃO DAS TONALIDADES (DADOS FIXOS)
    // ============================================================
    const TONALIDADES = [
        { nome: 'Dó Maior',     escala: ['C', 'D', 'E', 'F', 'G', 'A', 'B'],       tipo: 'maior' },
        { nome: 'Ré menor',     escala: ['D', 'E', 'F', 'G', 'A', 'B', 'C'],       tipo: 'menor' },
        { nome: 'Mi menor',     escala: ['E', 'F#', 'G', 'A', 'B', 'C', 'D'],      tipo: 'menor' },
        { nome: 'Fá Maior',     escala: ['F', 'G', 'A', 'B♭', 'C', 'D', 'E'],     tipo: 'maior' },
        { nome: 'Sol Maior',    escala: ['G', 'A', 'B', 'C', 'D', 'E', 'F#'],     tipo: 'maior' },
        { nome: 'Lá menor',     escala: ['A', 'B', 'C', 'D', 'E', 'F', 'G'],       tipo: 'menor' },
        { nome: 'Si diminuto',  escala: ['B', 'C', 'D', 'E', 'F', 'G', 'A'],       tipo: 'diminuto' }
    ];

    // ============================================================
    //  GERADOR DE CONJUNTOS (recebe a tonalidade como parâmetro)
    // ============================================================
    function gerarConjuntos(tonalidadeNome) {
        const ton = TONALIDADES.find(t => t.nome === tonalidadeNome);
        if (!ton) return [];

        const conjuntos = [];
        const tamanhos = [3, 4, 5, 6, 7, 8];
        const nomesNotas = {
            'C': 'Dó', 'C#': 'Dó#', 'D♭': 'Ré♭',
            'D': 'Ré', 'D#': 'Ré#', 'E♭': 'Mi♭',
            'E': 'Mi', 'F': 'Fá', 'F#': 'Fá#', 'G♭': 'Sol♭',
            'G': 'Sol', 'G#': 'Sol#', 'A♭': 'Lá♭',
            'A': 'Lá', 'A#': 'Lá#', 'B♭': 'Si♭',
            'B': 'Si', 'C♭': 'Dó♭'
        };
        const freqBase = {
            'C': 261.63, 'C#': 277.18, 'D♭': 277.18,
            'D': 293.66, 'D#': 311.13, 'E♭': 311.13,
            'E': 329.63, 'F': 349.23, 'F#': 369.99, 'G♭': 369.99,
            'G': 392.00, 'G#': 415.30, 'A♭': 415.30,
            'A': 440.00, 'A#': 466.16, 'B♭': 466.16,
            'B': 493.88
        };
        const cores = {
            'C': '#b13e3e', 'C#': '#b13e3e', 'D♭': '#c0762b',
            'D': '#c0762b', 'D#': '#c0762b', 'E♭': '#b8942a',
            'E': '#b8942a', 'F': '#3f8040', 'F#': '#3f8040', 'G♭': '#2a6b8f',
            'G': '#2a6b8f', 'G#': '#2a6b8f', 'A♭': '#7a4f9e',
            'A': '#7a4f9e', 'A#': '#7a4f9e', 'B♭': '#a54b6b',
            'B': '#a54b6b'
        };

        function criarNota(nomeNota, oitava) {
            let key = nomeNota.toLowerCase().replace('♭', 'b').replace('#', '');
            key += '/' + oitava;
            const freq = freqBase[nomeNota] * Math.pow(2, oitava - 4);
            return { key, nome: nomesNotas[nomeNota] || nomeNota, cor: cores[nomeNota] || '#333', freq, letra: nomeNota };
        }

        const escala = ton.escala;
        const nomeTon = ton.nome;
        const len = escala.length;

        // Acordes (arpejos de 3 e 4 notas)
        const graus3 = [0, 2, 4];
        const graus4 = [0, 2, 4, 6];
        const tiposAcorde = [
            { tam: 3, graus: graus3 },
            { tam: 4, graus: graus4 }
        ];
        tiposAcorde.forEach(tipo => {
            for (let i = 0; i < len; i++) {
                const notasLetras = [];
                for (let j = 0; j < tipo.tam; j++) {
                    const idx = (i + tipo.graus[j]) % len;
                    notasLetras.push(escala[idx]);
                }
                const nome = notasLetras.map(n => nomesNotas[n] || n).join(' ');
                const notasObj = notasLetras.map((n, idx) => {
                    const posAbs = i + tipo.graus[idx];
                    const voltas = Math.floor(posAbs / len);
                    const oitava = 4 + voltas;
                    return criarNota(n, oitava);
                });
                conjuntos.push({ nome: `${nomeTon} - ${nome}`, notas: notasObj });
            }
        });

        // Escalas consecutivas de 3 a 8 notas
        tamanhos.forEach(tam => {
            for (let i = 0; i < len; i++) {
                const notasLetras = [];
                for (let j = 0; j < tam; j++) {
                    const idx = (i + j) % len;
                    notasLetras.push(escala[idx]);
                }
                const nome = notasLetras.map(n => nomesNotas[n] || n).join(' ');
                const notasObj = notasLetras.map((n, idx) => {
                    const posAbs = i + idx;
                    const voltas = Math.floor(posAbs / len);
                    const oitava = 4 + voltas;
                    return criarNota(n, oitava);
                });
                conjuntos.push({ nome: `${nomeTon} - ${nome}`, notas: notasObj });
            }
        });

        return conjuntos;
    }

    // ============================================================
    //  DOM ELEMENTOS
    // ============================================================
    const notationEl = document.getElementById('notation');
    const feedbackMsg = document.getElementById('feedbackMsg');
    const conjuntoLabel = document.getElementById('conjuntoLabel');
    const etapaLabel = document.getElementById('etapaLabel');
    const acertosLabel = document.getElementById('acertosLabel');
    const errosLabel = document.getElementById('errosLabel');
    const btnPlay = document.getElementById('btnPlay');
    const btnRepeat = document.getElementById('btnRepeat');
    const legendaEl = document.getElementById('legenda');
    const overlay = document.getElementById('orientationOverlay');
    const tonalidadeSelect = document.getElementById('tonalidadeSelect');

    // ============================================================
    //  VARIÁVEIS DE ESTADO
    // ============================================================
    let audioCtx = null;
    let estaTocando = false;
    let aguardandoResposta = false;
    let notaEsperada = null;
    let notaEsperadaObj = null;
    let timeoutIds = [];
    let notaDestaque = -1;
    let acertos = 0;
    let erros = 0;
    let conjuntoIndex = 0;
    let CONJUNTOS = [];
    let TOTAL_CONJUNTOS = 0;
    let jogoTerminado = false;
    let perguntaConcluida = false;
    let timeoutsPergunta = []; // para controlar os timeouts da pergunta

    // ============================================================
    //  FUNÇÃO PARA CARREGAR TONALIDADE E REINICIAR O JOGO
    // ============================================================
    function carregarTonalidade(tonalidadeNome) {
        CONJUNTOS = gerarConjuntos(tonalidadeNome);
        TOTAL_CONJUNTOS = CONJUNTOS.length;

        conjuntoIndex = 0;
        acertos = 0;
        erros = 0;
        jogoTerminado = false;
        perguntaConcluida = false;
        aguardandoResposta = false;
        estaTocando = false;
        notaEsperada = null;
        notaEsperadaObj = null;
        timeoutIds.forEach(id => clearTimeout(id));
        timeoutIds = [];
        notaDestaque = -1;

        desenharPartitura(-1);
        atualizarInterface();
        feedbackMsg.textContent = '';
        feedbackMsg.className = 'feedback';
        btnPlay.disabled = false;
        btnRepeat.disabled = true;
        document.querySelectorAll('.nota-btn').forEach(b => b.classList.remove('acertou', 'errou', 'destaque'));
        console.log(`🔄 Tonalidade alterada para: ${tonalidadeNome} (${TOTAL_CONJUNTOS} conjuntos)`);
    }

    // ============================================================
    //  ÁUDIO – PIANO SIMPLES
    // ============================================================
    function tocarNota(notaLetra, duracao = 0.6, volume = 0.35) {
        try {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const notas = CONJUNTOS[conjuntoIndex]?.notas || [];
            const nota = notas.find(n => n.letra === notaLetra);
            if (!nota) return;

            const freq = nota.freq;
            const time = audioCtx.currentTime;

            const osc1 = audioCtx.createOscillator();
            const gain1 = audioCtx.createGain();
            osc1.type = 'sine';
            osc1.frequency.setValueAtTime(freq, time);
            gain1.gain.setValueAtTime(0, time);
            gain1.gain.linearRampToValueAtTime(volume * 0.7, time + 0.01);
            gain1.gain.exponentialRampToValueAtTime(0.001, time + duracao * 0.6);

            const osc2 = audioCtx.createOscillator();
            const gain2 = audioCtx.createGain();
            osc2.type = 'triangle';
            osc2.frequency.setValueAtTime(freq * 2, time);
            gain2.gain.setValueAtTime(0, time);
            gain2.gain.linearRampToValueAtTime(volume * 0.12, time + 0.01);
            gain2.gain.exponentialRampToValueAtTime(0.001, time + duracao * 0.5);

            osc1.connect(gain1);
            gain1.connect(audioCtx.destination);
            osc2.connect(gain2);
            gain2.connect(audioCtx.destination);

            osc1.start(time);
            osc1.stop(time + duracao);
            osc2.start(time);
            osc2.stop(time + duracao);

            return true;
        } catch (e) {
            console.error('Erro ao tocar nota:', e);
            return false;
        }
    }

    // ============================================================
    //  PARTITURA – CENTRALIZADA, SEM TÍTULO/NOMES
    // ============================================================
    function desenharPartitura(destaqueIndex = -1) {
        notationEl.innerHTML = '';
        if (!CONJUNTOS.length) return;
        try {
            if (typeof Vex === 'undefined') {
                throw new Error('VexFlow não carregado.');
            }
            const VF = Vex.Flow;
            const width = Math.min(notationEl.clientWidth || 850, 900);
            const height = 110;
            const renderer = new VF.Renderer(notationEl, VF.Renderer.Backends.SVG);
            renderer.resize(width, height);
            const ctx = renderer.getContext();

            const stave = new VF.Stave(50, 0, width - 100);
            stave.addClef('treble');
            stave.addTimeSignature('4/4');
            stave.setContext(ctx);
            stave.draw();

            const notasAtuais = CONJUNTOS[conjuntoIndex]?.notas || [];
            const notasVex = notasAtuais.map(n =>
                new VF.StaveNote({ keys: [n.key], duration: 'w', auto_stem: false })
            );

            const totalBeats = notasAtuais.length * 4;
            const voice = new VF.Voice({ num_beats: totalBeats, beat_value: 4, resolution: VF.RESOLUTION });
            voice.addTickables(notasVex);
            new VF.Formatter().joinVoices([voice]).format([voice], width - 140);
            voice.draw(ctx, stave);

            if (destaqueIndex >= 0 && destaqueIndex < notasAtuais.length) {
                const svg = notationEl.querySelector('svg');
                if (svg) {
                    const notaWidth = (width - 140) / notasAtuais.length;
                    const x = 70 + (destaqueIndex * notaWidth) + notaWidth / 2;
                    const y = 30;

                    const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
                    const filter = document.createElementNS('http://www.w3.org/2000/svg', 'filter');
                    filter.setAttribute('id', 'glow');
                    filter.setAttribute('x', '-50%');
                    filter.setAttribute('y', '-50%');
                    filter.setAttribute('width', '200%');
                    filter.setAttribute('height', '200%');
                    const blur = document.createElementNS('http://www.w3.org/2000/svg', 'feGaussianBlur');
                    blur.setAttribute('stdDeviation', '3');
                    blur.setAttribute('result', 'blur');
                    const merge = document.createElementNS('http://www.w3.org/2000/svg', 'feMerge');
                    const m1 = document.createElementNS('http://www.w3.org/2000/svg', 'feMergeNode');
                    m1.setAttribute('in', 'blur');
                    const m2 = document.createElementNS('http://www.w3.org/2000/svg', 'feMergeNode');
                    m2.setAttribute('in', 'SourceGraphic');
                    merge.appendChild(m1);
                    merge.appendChild(m2);
                    filter.appendChild(blur);
                    filter.appendChild(merge);
                    defs.appendChild(filter);
                    svg.insertBefore(defs, svg.firstChild);

                    const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                    circle.setAttribute('cx', x);
                    circle.setAttribute('cy', y - 5);
                    circle.setAttribute('r', '12');
                    circle.setAttribute('fill', notasAtuais[destaqueIndex].cor);
                    circle.setAttribute('opacity', '0.85');
                    circle.setAttribute('stroke', 'white');
                    circle.setAttribute('stroke-width', '3');
                    circle.setAttribute('filter', 'url(#glow)');
                    svg.appendChild(circle);
                }
            }

            ctx.save();
            ctx.setStrokeStyle('#333');
            ctx.setLineWidth(3);
            ctx.beginPath();
            ctx.moveTo(width - 60, stave.getYForLine(4) - 5);
            ctx.lineTo(width - 60, stave.getYForLine(0) + 5);
            ctx.stroke();
            ctx.restore();

        } catch (e) {
            console.error('Erro ao desenhar partitura:', e);
            const nomes = CONJUNTOS[conjuntoIndex]?.notas.map(n => n.nome).join(' ') || '';
            notationEl.innerHTML = `<div style="text-align:center;padding:20px;color:#666;"><p>🎵 ${nomes}</p></div>`;
        }
    }

    // ============================================================
    //  INTERFACE E LÓGICA DO JOGO (com repetição 4x)
    // ============================================================
    function atualizarInterface() {
        if (!CONJUNTOS.length) {
            conjuntoLabel.textContent = 'Nenhum exercício';
            etapaLabel.textContent = '0 / 0';
            return;
        }
        conjuntoLabel.textContent = CONJUNTOS[conjuntoIndex]?.nome || '';
        etapaLabel.textContent = `${conjuntoIndex + 1} / ${TOTAL_CONJUNTOS}`;
        acertosLabel.textContent = acertos;
        errosLabel.textContent = erros;

        legendaEl.innerHTML = '';
        const notasAtuais = CONJUNTOS[conjuntoIndex]?.notas || [];
        notasAtuais.forEach(nota => {
            const btn = document.createElement('button');
            btn.className = 'nota-btn';
            btn.dataset.nota = nota.letra;
            btn.innerHTML = `<span class="bola" style="background:${nota.cor};"></span> ${nota.nome}`;
            btn.disabled = true;
            btn.addEventListener('click', function() {
                if (aguardandoResposta && !jogoTerminado && !perguntaConcluida) {
                    verificarResposta(this.dataset.nota);
                }
            });
            legendaEl.appendChild(btn);
        });

        desabilitarBotoes(true);
        btnPlay.disabled = (jogoTerminado || perguntaConcluida || !CONJUNTOS.length);
        btnRepeat.disabled = true;
        if (aguardandoResposta) {
            desabilitarBotoes(false);
            btnPlay.disabled = true;
            btnRepeat.disabled = false;
        }
    }

    function desabilitarBotoes(desabilitar) {
        document.querySelectorAll('.nota-btn').forEach(b => b.disabled = desabilitar);
    }

    // ============================================================
    //  CONSTRUIR SEQUÊNCIA COM REPETIÇÃO 4x
    // ============================================================
    function construirSequencia() {
        const notas = CONJUNTOS[conjuntoIndex]?.notas || [];
        const letras = notas.map(n => n.letra);
        const repeticoes = 4;
        let sequencia = [];

        for (let i = 0; i < letras.length; i++) {
            for (let r = 0; r < repeticoes; r++) {
                sequencia.push(letras[i]);
            }
        }

        for (let i = letras.length - 1; i >= 0; i--) {
            for (let r = 0; r < repeticoes; r++) {
                sequencia.push(letras[i]);
            }
        }

        return sequencia;
    }

    // ============================================================
    //  TOCAR ESCALA COM REPETIÇÕES (DUPLICAÇÃO DA DURAÇÃO)
    // ============================================================
    function tocarEscala() {
        if (estaTocando || jogoTerminado || perguntaConcluida || !CONJUNTOS.length) return;
        estaTocando = true;
        btnPlay.disabled = true;
        btnRepeat.disabled = true;
        desabilitarBotoes(true);
        feedbackMsg.textContent = '';
        feedbackMsg.className = 'feedback';

        const sequencia = construirSequencia();
        const duracaoNota = 0.4;
        const intervalo = 0.15;
        const pausaMeio = 0.4;

        const seqEventos = [];
        const meio = Math.floor(sequencia.length / 2);
        sequencia.forEach((letra, idx) => {
            seqEventos.push({ letra: letra, duracao: duracaoNota });
            if (idx === meio - 1) {
                seqEventos.push({ letra: null, duracao: pausaMeio });
            }
        });

        timeoutIds.forEach(id => clearTimeout(id));
        timeoutIds = [];

        let tempoCorrente = 0;
        seqEventos.forEach((item, index) => {
            const delay = tempoCorrente;
            const id = setTimeout(() => {
                if (item.letra === null) {
                    notaDestaque = -1;
                    desenharPartitura(notaDestaque);
                } else {
                    tocarNota(item.letra, item.duracao, 0.30);
                    const idxNota = CONJUNTOS[conjuntoIndex]?.notas.findIndex(n => n.letra === item.letra) ?? -1;
                    notaDestaque = (idxNota !== -1) ? idxNota : -1;
                    desenharPartitura(notaDestaque);
                }
                if (index === seqEventos.length - 1) {
                    setTimeout(() => {
                        setTimeout(() => iniciarPergunta(), 300);
                    }, item.duracao * 1000 + 50);
                }
            }, delay * 1000);
            timeoutIds.push(id);

            if (item.letra !== null) {
                tempoCorrente += item.duracao + intervalo;
            } else {
                tempoCorrente += item.duracao;
            }
        });
    }

    // ============================================================
    //  PERGUNTA (COM ÍCONE 🔊 CENTRALIZADO)
    // ============================================================
    function iniciarPergunta() {
        if (jogoTerminado || perguntaConcluida || !CONJUNTOS.length) return;
        const notas = CONJUNTOS[conjuntoIndex]?.notas || [];
        if (!notas.length) return;
        const indice = Math.floor(Math.random() * notas.length);
        notaEsperada = notas[indice].letra;
        notaEsperadaObj = notas[indice];

        // Limpa timeouts anteriores da pergunta
        if (timeoutsPergunta) {
            timeoutsPergunta.forEach(id => clearTimeout(id));
            timeoutsPergunta = [];
        }

        // Remove qualquer destaque da partitura (figura oculta)
        notaDestaque = -1;
        desenharPartitura(notaDestaque);

        // Mostra o ícone 🔊 centralizado (grande)
        feedbackMsg.textContent = '🔊';
        feedbackMsg.className = 'feedback icone';

        // === Cronograma: mostrar ícone -> tocar som -> ocultar ícone ===
        // 1. Aguarda 300ms para o usuário ver o ícone
        const id1 = setTimeout(() => {
            // 2. Toca a nota
            tocarNota(notaEsperada, 0.6, 0.35);
        }, 300);
        timeoutsPergunta.push(id1);

        // 3. Aguarda 300ms (espera) + 600ms (duração da nota) + 150ms (margem) = 1050ms
        const id2 = setTimeout(() => {
            // 4. Oculta o ícone e mostra a mensagem de instrução
            feedbackMsg.textContent = '🎧 Ouça a nota e clique na opção correta!';
            feedbackMsg.className = 'feedback info';
            // Habilita os botões para resposta
            aguardandoResposta = true;
            desabilitarBotoes(false);
            btnPlay.disabled = true;
            btnRepeat.disabled = false;
            document.querySelectorAll('.nota-btn').forEach(b => b.classList.remove('destaque'));
        }, 300 + 600 + 150);
        timeoutsPergunta.push(id2);
    }

    // ============================================================
    //  REPETIR NOTA (com ícone também, para consistência)
    // ============================================================
    function repetirNota() {
        if (!aguardandoResposta || !notaEsperada || jogoTerminado || perguntaConcluida) return;
        
        // Limpa timeouts antigos
        if (timeoutsPergunta) {
            timeoutsPergunta.forEach(id => clearTimeout(id));
            timeoutsPergunta = [];
        }

        // Remove destaque
        notaDestaque = -1;
        desenharPartitura(notaDestaque);

        // Mostra o ícone novamente
        feedbackMsg.textContent = '🔊';
        feedbackMsg.className = 'feedback icone';

        const id1 = setTimeout(() => {
            tocarNota(notaEsperada, 0.6, 0.35);
        }, 300);
        timeoutsPergunta.push(id1);

        const id2 = setTimeout(() => {
            feedbackMsg.textContent = '🎧 Ouça novamente e clique na opção!';
            feedbackMsg.className = 'feedback info';
            // Reativa a resposta (caso tenha sido desativada)
            aguardandoResposta = true;
            desabilitarBotoes(false);
            btnPlay.disabled = true;
            btnRepeat.disabled = false;
        }, 300 + 600 + 150);
        timeoutsPergunta.push(id2);
    }

    // ============================================================
    //  VERIFICAR RESPOSTA
    // ============================================================
    function verificarResposta(letraClicada) {
        if (!aguardandoResposta || jogoTerminado || perguntaConcluida) return;
        aguardandoResposta = false;
        desabilitarBotoes(true);
        btnRepeat.disabled = true;
        
        // Limpa timeouts pendentes da pergunta (para não sobrescrever o feedback)
        if (timeoutsPergunta) {
            timeoutsPergunta.forEach(id => clearTimeout(id));
            timeoutsPergunta = [];
        }

        const acertou = (letraClicada === notaEsperada);
        document.querySelectorAll('.nota-btn').forEach(btn => {
            btn.classList.remove('destaque', 'acertou', 'errou');
            if (btn.dataset.nota === letraClicada) {
                btn.classList.add(acertou ? 'acertou' : 'errou');
            }
            if (btn.dataset.nota === notaEsperada && !acertou) {
                btn.classList.add('destaque');
                setTimeout(() => btn.classList.remove('destaque'), 1000);
            }
        });

        if (acertou) {
            acertos++;
            perguntaConcluida = true;
            feedbackMsg.textContent = `🎉 Parabéns! Você acertou: ${notaEsperadaObj.nome}!`;
            feedbackMsg.className = 'feedback sucesso';
            setTimeout(() => avançarEtapa(), 1000);
        } else {
            erros++;
            feedbackMsg.textContent = `😢 Que pena! Você errou. A nota era ${notaEsperadaObj.nome}. Tente novamente!`;
            feedbackMsg.className = 'feedback erro';
            // Não avança, apenas permite tentar de novo (o usuário pode clicar em "Repetir")
            // Mas precisamos reativar a resposta para o próximo clique
            setTimeout(() => {
                // Limpa o feedback de erro após 1.5s para não atrapalhar
                // Mas mantém a resposta ativa
                aguardandoResposta = true;
                desabilitarBotoes(false);
                btnRepeat.disabled = false;
                // Limpa o texto de erro para não ficar poluído, mas podemos deixar
                // Vamos deixar a mensagem de erro e reativar os botões
                feedbackMsg.textContent = `😢 Errou! A nota era ${notaEsperadaObj.nome}. Tente novamente!`;
                feedbackMsg.className = 'feedback erro';
                // Reativa os botões para nova tentativa
                document.querySelectorAll('.nota-btn').forEach(b => b.classList.remove('acertou', 'errou', 'destaque'));
            }, 500);
        }
        atualizarInterface();
    }

    // ============================================================
    //  AVANÇAR ETAPA
    // ============================================================
    function avançarEtapa() {
        if (jogoTerminado) return;
        conjuntoIndex++;
        if (conjuntoIndex >= TOTAL_CONJUNTOS) {
            jogoTerminado = true;
            btnPlay.disabled = true;
            btnRepeat.disabled = true;
            desabilitarBotoes(true);
            feedbackMsg.textContent = `🏁 Fim! Acertos: ${acertos}, Erros: ${erros}`;
            feedbackMsg.className = 'feedback fim';
            return;
        }
        perguntaConcluida = false;
        aguardandoResposta = false;
        estaTocando = false;
        notaEsperada = null;
        notaEsperadaObj = null;
        btnPlay.disabled = false;
        btnRepeat.disabled = true;
        desabilitarBotoes(true);
        document.querySelectorAll('.nota-btn').forEach(b => b.classList.remove('acertou', 'errou', 'destaque'));
        feedbackMsg.textContent = '';
        feedbackMsg.className = 'feedback';
        desenharPartitura(-1);
        atualizarInterface();
    }

    // ============================================================
    //  EVENTOS
    // ============================================================
    btnPlay.addEventListener('click', () => {
        if (jogoTerminado || perguntaConcluida) return;
        if (aguardandoResposta || estaTocando) return;
        tocarEscala();
    });

    btnRepeat.addEventListener('click', repetirNota);

    tonalidadeSelect.addEventListener('change', function() {
        const tonalidade = this.value;
        carregarTonalidade(tonalidade);
    });

    overlay.addEventListener('click', () => overlay.classList.remove('show'));
    setTimeout(() => overlay.classList.remove('show'), 5000);

    // ============================================================
    //  INICIALIZAÇÃO
    // ============================================================
    function init() {
        if (typeof Vex === 'undefined') {
            setTimeout(init, 300);
            return;
        }
        const tonalidadePadrao = tonalidadeSelect.value;
        carregarTonalidade(tonalidadePadrao);
        console.log('✅ Carregado com ícone 🔊 antes da pergunta.');
    }

    if (document.readyState === 'complete') {
        setTimeout(init, 400);
    } else {
        window.addEventListener('load', () => setTimeout(init, 400));
    }

    let resizeTimeout;
    window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
            if (!estaTocando && !aguardandoResposta) {
                desenharPartitura(notaDestaque);
            }
        }, 300);
    });
</script>
