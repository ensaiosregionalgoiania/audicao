<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎵 Escalas de 3 a 8 notas - Semibreves</title>
    <script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.4/build/cjs/vexflow.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container {
            background: white;
            border-radius: 25px;
            padding: 20px 15px;
            max-width: 950px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            text-align: center;
            color: #333;
            font-size: 1.5em;
            margin-bottom: 10px;
        }
        h1 span {
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            text-align: center;
            color: #888;
            font-size: 0.85em;
            margin-bottom: 15px;
        }
        .info-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 10px;
            padding: 6px 10px;
            background: #f0f2ff;
            border-radius: 10px;
            font-weight: 500;
            color: #333;
            font-size: 0.9em;
        }
        .info-top .conjunto-label { color: #667eea; font-weight: bold; }
        .info-top .rodada { color: #FF9800; font-weight: bold; }
        .info-top .placar { color: #4CAF50; font-weight: bold; }
        .info-top .placar span.erros { color: #EF476F; }
        .partitura-container {
            background: #f8f9fa;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            padding: 10px 5px;
            min-height: 150px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: auto;
        }
        #notation { width: 100%; min-height: 120px; display: flex; justify-content: center; align-items: center; }
        #notation svg { max-width: 100%; height: auto; }
        .status-bar {
            display: flex;
            justify-content: center;
            margin: 12px 0 8px;
            padding: 8px 12px;
            background: #f0f2ff;
            border-radius: 12px;
        }
        .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            width: 100%;
            justify-content: center;
        }
        .btn {
            border: none;
            padding: 12px 20px;
            border-radius: 30px;
            color: white;
            font-weight: bold;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.2s;
            flex: 1 1 auto;
            min-width: 80px;
            text-align: center;
        }
        .btn:hover:not(:disabled) { transform: translateY(-2px); }
        .btn:active:not(:disabled) { transform: scale(0.95); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .btn-play { background: linear-gradient(135deg, #4CAF50, #45a049); box-shadow: 0 4px 15px rgba(76,175,80,0.3); }
        .btn-repeat { background: linear-gradient(135deg, #FF9800, #F57C00); box-shadow: 0 4px 15px rgba(255,152,0,0.3); }
        .legenda {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin: 12px 0 8px;
        }
        .nota-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border: 3px solid transparent;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1em;
            background: #f8f9fa;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            user-select: none;
            flex: 0 1 auto;
        }
        .nota-btn .bola { display: inline-block; width: 16px; height: 16px; border-radius: 50%; border: 1px solid #ccc; }
        .nota-btn:hover:not(:disabled) { transform: scale(1.05); border-color: #667eea; }
        .nota-btn:active:not(:disabled) { transform: scale(0.95); }
        .nota-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
        .nota-btn.acertou { border-color: #4CAF50; background: #e8f5e9; transform: scale(1.05); }
        .nota-btn.errou { border-color: #EF476F; background: #fce4ec; transform: scale(0.95); animation: shake 0.3s; }
        .nota-btn.destaque { border-color: #FF9800; background: #fff3e0; box-shadow: 0 0 15px rgba(255,152,0,0.3); }
        @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
        .feedback {
            text-align: center;
            font-size: 1.1em;
            font-weight: bold;
            min-height: 36px;
            padding: 8px;
            border-radius: 12px;
            margin: 8px 0;
            transition: all 0.3s;
        }
        .feedback.sucesso { color: #4CAF50; background: #e8f5e9; }
        .feedback.erro { color: #EF476F; background: #fce4ec; }
        .feedback.info { color: #667eea; background: #e8eaf6; }
        .feedback.fim { color: #FF9800; background: #fff3e0; font-size: 1.3em; }
        .info { text-align: center; color: #666; font-size: 0.8em; margin-top: 8px; }
        @media (max-width: 600px) {
            .container { padding: 12px; }
            h1 { font-size: 1.2em; }
            .info-top { font-size: 0.75em; padding: 4px 8px; }
            .nota-btn { padding: 6px 12px; font-size: 0.85em; }
            .btn { padding: 10px 14px; font-size: 0.9em; min-width: 60px; }
            .feedback { font-size: 0.95em; padding: 6px; }
            .partitura-container { padding: 5px; min-height: 120px; }
            #notation { min-height: 100px; }
            .legenda { gap: 8px; }
        }
        @media (max-width: 400px) {
            .btn { font-size: 0.75em; padding: 8px 10px; min-width: 50px; }
            .nota-btn { font-size: 0.7em; padding: 4px 8px; }
            .info-top { font-size: 0.65em; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎵 <span>Escalas de 3 a 8 notas</span></h1>
    <div class="subtitle">Ouça a escala e adivinhe a nota!</div>

    <div class="info-top">
        <span>🎼 <span class="conjunto-label" id="conjuntoLabel">Dó Maior - Dó Mi Sol</span></span>
        <span>🔁 <span class="rodada" id="etapaLabel">1 / 100</span></span>
        <span class="placar">✅ <span id="acertosLabel">0</span> &nbsp;|&nbsp; <span class="erros">❌ <span id="errosLabel">0</span></span></span>
    </div>

    <div class="partitura-container">
        <div id="notation"></div>
    </div>

    <div class="status-bar">
        <div class="btn-group">
            <button class="btn btn-play" id="btnPlay">▶ Tocar</button>
            <button class="btn btn-repeat" id="btnRepeat" disabled>🔁 Repetir</button>
        </div>
    </div>

    <div class="feedback" id="feedbackMsg"></div>

    <div class="legenda" id="legenda">
        <!-- Botões gerados dinamicamente -->
    </div>

    <div class="info">🎼 Ouça a escala (ascendente e descendente) e depois adivinhe a nota isolada!</div>
</div>

<script>
    // ============================================================
    //  DEFINIÇÃO DAS TONALIDADES E ESCALAS
    // ============================================================
    const TONALIDADES = [
        { nome: 'Dó Maior',     escala: ['C', 'D', 'E', 'F', 'G', 'A', 'B'],       tipo: 'maior' },
        { nome: 'Ré menor',     escala: ['D', 'E', 'F', 'G', 'A', 'B', 'C'],       tipo: 'menor' },
        { nome: 'Mi menor',     escala: ['E', 'F#', 'G', 'A', 'B', 'C', 'D'],      tipo: 'menor' },
        { nome: 'Fá Maior',     escala: ['F', 'G', 'A', 'B♭', 'C', 'D', 'E'],     tipo: 'maior' },
        { nome: 'Sol Maior',    escala: ['G', 'A', 'B', 'C', 'D', 'E', 'F#'],     tipo: 'maior' },
        { nome: 'Lá menor',     escala: ['A', 'B', 'C', 'D', 'E', 'F', 'G'],       tipo: 'menor' },
        { nome: 'Si diminuto',  escala: ['B', 'C', 'D', 'E', 'F', 'G', 'A'],       tipo: 'diminuto' }
    ];

    // ============================================================
    //  GERADOR DE CONJUNTOS (com frequências ajustadas por oitava)
    // ============================================================
    function gerarConjuntos() {
        const conjuntos = [];
        const tamanhos = [3, 4, 5, 6, 7, 8];
        
        const nomesNotas = {
            'C': 'Dó', 'C#': 'Dó#', 'D♭': 'Ré♭',
            'D': 'Ré', 'D#': 'Ré#', 'E♭': 'Mi♭',
            'E': 'Mi', 'F': 'Fá', 'F#': 'Fá#', 'G♭': 'Sol♭',
            'G': 'Sol', 'G#': 'Sol#', 'A♭': 'Lá♭',
            'A': 'Lá', 'A#': 'Lá#', 'B♭': 'Si♭',
            'B': 'Si', 'C♭': 'Dó♭'
        };

        const freqBase = {
            'C': 261.63, 'C#': 277.18, 'D♭': 277.18,
            'D': 293.66, 'D#': 311.13, 'E♭': 311.13,
            'E': 329.63, 'F': 349.23, 'F#': 369.99, 'G♭': 369.99,
            'G': 392.00, 'G#': 415.30, 'A♭': 415.30,
            'A': 440.00, 'A#': 466.16, 'B♭': 466.16,
            'B': 493.88
        };

        const cores = {
            'C': '#b13e3e', 'C#': '#b13e3e', 'D♭': '#c0762b',
            'D': '#c0762b', 'D#': '#c0762b', 'E♭': '#b8942a',
            'E': '#b8942a', 'F': '#3f8040', 'F#': '#3f8040', 'G♭': '#2a6b8f',
            'G': '#2a6b8f', 'G#': '#2a6b8f', 'A♭': '#7a4f9e',
            'A': '#7a4f9e', 'A#': '#7a4f9e', 'B♭': '#a54b6b',
            'B': '#a54b6b'
        };

        function criarNota(nomeNota, oitava) {
            let key = nomeNota.toLowerCase().replace('♭', 'b').replace('#', '');
            key += '/' + oitava;
            const freq = freqBase[nomeNota] * Math.pow(2, oitava - 4);
            return {
                key: key,
                nome: nomesNotas[nomeNota] || nomeNota,
                cor: cores[nomeNota] || '#333',
                freq: freq,
                letra: nomeNota
            };
        }

        TONALIDADES.forEach(ton => {
            const escala = ton.escala;
            const nomeTon = ton.nome;
            const len = escala.length;

            // 1. ACORDES (arpejos de 3 e 4 notas)
            const graus3 = [0, 2, 4];
            const graus4 = [0, 2, 4, 6];
            const tiposAcorde = [
                { tam: 3, graus: graus3 },
                { tam: 4, graus: graus4 }
            ];
            tiposAcorde.forEach(tipo => {
                for (let i = 0; i < len; i++) {
                    const notasLetras = [];
                    for (let j = 0; j < tipo.tam; j++) {
                        const idx = (i + tipo.graus[j]) % len;
                        notasLetras.push(escala[idx]);
                    }
                    const nome = notasLetras.map(n => nomesNotas[n] || n).join(' ');
                    const notasObj = notasLetras.map((n, idx) => {
                        const posAbs = i + tipo.graus[idx];
                        const voltas = Math.floor(posAbs / len);
                        const oitava = 4 + voltas;
                        return criarNota(n, oitava);
                    });
                    conjuntos.push({
                        nome: `${nomeTon} - ${nome}`,
                        notas: notasObj
                    });
                }
            });

            // 2. ESCALAS (sequências consecutivas) de 3 a 8 notas
            tamanhos.forEach(tam => {
                for (let i = 0; i < len; i++) {
                    const notasLetras = [];
                    for (let j = 0; j < tam; j++) {
                        const idx = (i + j) % len;
                        notasLetras.push(escala[idx]);
                    }
                    const nome = notasLetras.map(n => nomesNotas[n] || n).join(' ');
                    const notasObj = notasLetras.map((n, idx) => {
                        const posAbs = i + idx;
                        const voltas = Math.floor(posAbs / len);
                        const oitava = 4 + voltas;
                        return criarNota(n, oitava);
                    });
                    conjuntos.push({
                        nome: `${nomeTon} - ${nome}`,
                        notas: notasObj
                    });
                }
            });
        });

        return conjuntos;
    }

    // ============================================================
    //  CONJUNTOS GERADOS DINAMICAMENTE
    // ============================================================
    const CONJUNTOS = gerarConjuntos();

    // ============================================================
    //  DOM ELEMENTOS
    // ============================================================
    const notationEl = document.getElementById('notation');
    const feedbackMsg = document.getElementById('feedbackMsg');
    const conjuntoLabel = document.getElementById('conjuntoLabel');
    const etapaLabel = document.getElementById('etapaLabel');
    const acertosLabel = document.getElementById('acertosLabel');
    const errosLabel = document.getElementById('errosLabel');
    const btnPlay = document.getElementById('btnPlay');
    const btnRepeat = document.getElementById('btnRepeat');
    const legendaEl = document.getElementById('legenda');

    // ============================================================
    //  VARIÁVEIS DE ESTADO
    // ============================================================
    let audioCtx = null;
    let estaTocando = false;
    let aguardandoResposta = false;
    let notaEsperada = null;
    let notaEsperadaObj = null;
    let timeoutIds = [];
    let notaDestaque = -1;

    let acertos = 0;
    let erros = 0;

    let conjuntoIndex = 0;
    const TOTAL_CONJUNTOS = CONJUNTOS.length;
    let jogoTerminado = false;
    let perguntaConcluida = false;

    // ============================================================
    //  FUNÇÃO DE ÁUDIO – SOM DE ÓRGÃO
    // ============================================================
    function tocarNota(notaLetra, duracao = 0.6, volume = 0.35) {
        try {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const notas = CONJUNTOS[conjuntoIndex].notas;
            const nota = notas.find(n => n.letra === notaLetra);
            if (!nota) return;

            const freq = nota.freq;

            // Oscilador 1: onda quadrada (som encorpado)
            const osc1 = audioCtx.createOscillator();
            const gain1 = audioCtx.createGain();
            osc1.type = 'square';
            osc1.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain1.gain.setValueAtTime(volume * 0.6, audioCtx.currentTime);
            gain1.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duracao);

            // Oscilador 2: onda senoidal com detune +12 cents (harmônico)
            const osc2 = audioCtx.createOscillator();
            const gain2 = audioCtx.createGain();
            osc2.type = 'sine';
            osc2.frequency.setValueAtTime(freq * 1.01, audioCtx.currentTime);
            gain2.gain.setValueAtTime(volume * 0.25, audioCtx.currentTime);
            gain2.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duracao);

            // Oscilador 3: uma oitava acima (8va) com volume baixo
            const osc3 = audioCtx.createOscillator();
            const gain3 = audioCtx.createGain();
            osc3.type = 'triangle';
            osc3.frequency.setValueAtTime(freq * 2, audioCtx.currentTime);
            gain3.gain.setValueAtTime(volume * 0.12, audioCtx.currentTime);
            gain3.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duracao);

            osc1.connect(gain1);
            gain1.connect(audioCtx.destination);
            osc2.connect(gain2);
            gain2.connect(audioCtx.destination);
            osc3.connect(gain3);
            gain3.connect(audioCtx.destination);

            osc1.start();
            osc1.stop(audioCtx.currentTime + duracao);
            osc2.start();
            osc2.stop(audioCtx.currentTime + duracao);
            osc3.start();
            osc3.stop(audioCtx.currentTime + duracao);

            return true;
        } catch (e) {
            console.error('Erro ao tocar nota:', e);
            return false;
        }
    }

    // ============================================================
    //  DESENHAR PARTITURA - COM SEMIBREVES
    // ============================================================
    function desenharPartitura(destaqueIndex = -1) {
        notationEl.innerHTML = '';
        try {
            if (typeof Vex === 'undefined') {
                throw new Error('VexFlow não carregado.');
            }
            const VF = Vex.Flow;
            const width = Math.min(notationEl.clientWidth || 850, 900);
            const height = 180;
            const renderer = new VF.Renderer(notationEl, VF.Renderer.Backends.SVG);
            renderer.resize(width, height);
            const ctx = renderer.getContext();

            const stave = new VF.Stave(50, 30, width - 100);
            stave.addClef('treble');
            stave.addTimeSignature('4/4');
            stave.setContext(ctx);
            stave.draw();

            const notasAtuais = CONJUNTOS[conjuntoIndex].notas;

            const notasVex = notasAtuais.map((n) => {
                return new VF.StaveNote({
                    keys: [n.key],
                    duration: 'w',
                    auto_stem: false
                });
            });

            const totalBeats = notasAtuais.length * 4;
            const voice = new VF.Voice({
                num_beats: totalBeats,
                beat_value: 4,
                resolution: VF.RESOLUTION
            });

            voice.addTickables(notasVex);

            new VF.Formatter()
                .joinVoices([voice])
                .format([voice], width - 140);

            voice.draw(ctx, stave);

            ctx.save();
            ctx.setFont('Arial', 14, 'bold');
            ctx.fillStyle = '#333';
            ctx.fillText(`Conjunto: ${CONJUNTOS[conjuntoIndex].nome}`, 50, 20);
            ctx.restore();

            const notaWidth = (width - 140) / notasAtuais.length;
            notasAtuais.forEach((nota, index) => {
                const x = 70 + (index * notaWidth) + notaWidth / 2;
                ctx.save();
                ctx.setFont('Arial', 14, 'bold');
                ctx.textAlign = 'center';
                ctx.fillStyle = nota.cor;
                ctx.fillText(nota.nome, x, stave.getYForLine(3) + 40);
                ctx.restore();
            });

            if (destaqueIndex >= 0 && destaqueIndex < notasAtuais.length) {
                const svg = notationEl.querySelector('svg');
                if (svg) {
                    const notaWidth2 = (width - 140) / notasAtuais.length;
                    const x = 70 + (destaqueIndex * notaWidth2) + notaWidth2 / 2;
                    const y = 35;

                    const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
                    const filter = document.createElementNS('http://www.w3.org/2000/svg', 'filter');
                    filter.setAttribute('id', 'glow');
                    filter.setAttribute('x', '-50%');
                    filter.setAttribute('y', '-50%');
                    filter.setAttribute('width', '200%');
                    filter.setAttribute('height', '200%');
                    const blur = document.createElementNS('http://www.w3.org/2000/svg', 'feGaussianBlur');
                    blur.setAttribute('stdDeviation', '3');
                    blur.setAttribute('result', 'blur');
                    const merge = document.createElementNS('http://www.w3.org/2000/svg', 'feMerge');
                    const m1 = document.createElementNS('http://www.w3.org/2000/svg', 'feMergeNode');
                    m1.setAttribute('in', 'blur');
                    const m2 = document.createElementNS('http://www.w3.org/2000/svg', 'feMergeNode');
                    m2.setAttribute('in', 'SourceGraphic');
                    merge.appendChild(m1);
                    merge.appendChild(m2);
                    filter.appendChild(blur);
                    filter.appendChild(merge);
                    defs.appendChild(filter);
                    svg.insertBefore(defs, svg.firstChild);

                    const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                    circle.setAttribute('cx', x);
                    circle.setAttribute('cy', y - 5);
                    circle.setAttribute('r', '14');
                    circle.setAttribute('fill', notasAtuais[destaqueIndex].cor);
                    circle.setAttribute('opacity', '0.85');
                    circle.setAttribute('stroke', 'white');
                    circle.setAttribute('stroke-width', '3');
                    circle.setAttribute('filter', 'url(#glow)');
                    svg.appendChild(circle);

                    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                    text.setAttribute('x', x);
                    text.setAttribute('y', y - 35);
                    text.setAttribute('text-anchor', 'middle');
                    text.setAttribute('font-size', '18');
                    text.setAttribute('font-weight', 'bold');
                    text.setAttribute('fill', notasAtuais[destaqueIndex].cor);
                    text.textContent = notasAtuais[destaqueIndex].nome;
                    svg.appendChild(text);
                }
            }

            ctx.save();
            ctx.setStrokeStyle('#333');
            ctx.setLineWidth(3);
            ctx.beginPath();
            ctx.moveTo(width - 60, stave.getYForLine(4) - 5);
            ctx.lineTo(width - 60, stave.getYForLine(0) + 5);
            ctx.stroke();
            ctx.restore();

        } catch (e) {
            console.error('Erro ao desenhar partitura:', e);
            const nomes = CONJUNTOS[conjuntoIndex].notas.map(n => n.nome).join(' ');
            notationEl.innerHTML = `<div style="text-align:center;padding:20px;color:#666;"><p>🎵 ${nomes}</p><p style="font-size:0.8em;color:#999;">(semibreves)</p></div>`;
        }
    }

    // ============================================================
    //  ATUALIZAR INTERFACE
    // ============================================================
    function atualizarInterface() {
        conjuntoLabel.textContent = CONJUNTOS[conjuntoIndex].nome;
        etapaLabel.textContent = `${conjuntoIndex + 1} / ${TOTAL_CONJUNTOS}`;
        acertosLabel.textContent = acertos;
        errosLabel.textContent = erros;

        legendaEl.innerHTML = '';
        const notasAtuais = CONJUNTOS[conjuntoIndex].notas;
        notasAtuais.forEach((nota) => {
            const btn = document.createElement('button');
            btn.className = 'nota-btn';
            btn.dataset.nota = nota.letra;
            btn.innerHTML = `<span class="bola" style="background:${nota.cor};"></span> ${nota.nome}`;
            btn.disabled = true;
            btn.addEventListener('click', function() {
                const letra = this.dataset.nota;
                if (aguardandoResposta && !jogoTerminado && !perguntaConcluida) {
                    verificarResposta(letra);
                }
            });
            legendaEl.appendChild(btn);
        });

        desabilitarBotoes(true);
        btnPlay.disabled = (jogoTerminado || perguntaConcluida);
        btnRepeat.disabled = true;
        if (aguardandoResposta) {
            desabilitarBotoes(false);
            btnPlay.disabled = true;
            btnRepeat.disabled = false;
        }
    }

    function desabilitarBotoes(desabilitar) {
        document.querySelectorAll('.nota-btn').forEach(b => b.disabled = desabilitar);
    }

    // ============================================================
    //  CONSTRUIR SEQUÊNCIA (ascendente + descendente)
    // ============================================================
    function construirSequencia() {
        const notas = CONJUNTOS[conjuntoIndex].notas;
        const letras = notas.map(n => n.letra);
        const ascendente = letras.slice();
        const descendente = letras.slice().reverse();
        return ascendente.concat(descendente);
    }

    // ============================================================
    //  LÓGICA DO JOGO (REPETIÇÃO EM CASO DE ERRO)
    // ============================================================

    function tocarEscala() {
        if (estaTocando || jogoTerminado || perguntaConcluida) return;
        estaTocando = true;
        btnPlay.disabled = true;
        btnRepeat.disabled = true;
        desabilitarBotoes(true);
        feedbackMsg.textContent = '';
        feedbackMsg.className = 'feedback';

        const sequencia = construirSequencia();
        const seqComPausa = [];
        const meio = Math.floor(sequencia.length / 2);
        sequencia.forEach((letra, idx) => {
            seqComPausa.push({ letra: letra, duracao: 0.4 });
            if (idx === meio - 1) {
                seqComPausa.push({ letra: null, duracao: 0.5 });
            }
        });
        if (seqComPausa.length > 0) {
            const ultimo = seqComPausa[seqComPausa.length - 1];
            if (ultimo.letra !== null) {
                ultimo.duracao = 1.2;
            }
        }

        const intervalo = 0.5;
        timeoutIds.forEach(id => clearTimeout(id));
        timeoutIds = [];

        seqComPausa.forEach((item, index) => {
            const delay = index * intervalo;
            const id = setTimeout(() => {
                if (item.letra === null) {
                    notaDestaque = -1;
                    desenharPartitura(notaDestaque);
                } else {
                    tocarNota(item.letra, item.duracao, 0.35);
                    const notas = CONJUNTOS[conjuntoIndex].notas;
                    const idxNota = notas.findIndex(n => n.letra === item.letra);
                    if (idxNota !== -1) {
                        notaDestaque = idxNota;
                        desenharPartitura(notaDestaque);
                    } else {
                        notaDestaque = -1;
                        desenharPartitura(notaDestaque);
                    }
                }

                if (index === seqComPausa.length - 1) {
                    const fimId = setTimeout(() => {
                        const id2 = setTimeout(() => {
                            iniciarPergunta();
                        }, 500);
                        timeoutIds.push(id2);
                    }, item.duracao * 1000 + 50);
                    timeoutIds.push(fimId);
                }
            }, delay * 1000);
            timeoutIds.push(id);
        });
    }

    function iniciarPergunta() {
        if (jogoTerminado || perguntaConcluida) return;
        const notas = CONJUNTOS[conjuntoIndex].notas;
        const indiceAleatorio = Math.floor(Math.random() * notas.length);
        notaEsperada = notas[indiceAleatorio].letra;
        notaEsperadaObj = notas[indiceAleatorio];

        tocarNota(notaEsperada, 0.6, 0.35);
        notaDestaque = -1;
        desenharPartitura(notaDestaque);

        feedbackMsg.textContent = '🎧 Ouça a nota e clique na opção correta!';
        feedbackMsg.className = 'feedback info';

        aguardandoResposta = true;
        desabilitarBotoes(false);
        btnPlay.disabled = true;
        btnRepeat.disabled = false;
        document.querySelectorAll('.nota-btn').forEach(btn => btn.classList.remove('destaque'));
    }

    function repetirNota() {
        if (!aguardandoResposta || !notaEsperada || jogoTerminado || perguntaConcluida) return;
        tocarNota(notaEsperada, 0.6, 0.35);
        notaDestaque = -1;
        desenharPartitura(notaDestaque);
        feedbackMsg.textContent = '🎧 Ouça novamente e clique na opção!';
        feedbackMsg.className = 'feedback info';
    }

    // ============================================================
    //  VERIFICAR RESPOSTA – AVANÇO AUTOMÁTICO APÓS ACERTO
    // ============================================================
    function verificarResposta(letraClicada) {
        if (!aguardandoResposta || jogoTerminado || perguntaConcluida) return;
        aguardandoResposta = false;
        desabilitarBotoes(true);
        btnRepeat.disabled = true;

        const acertou = (letraClicada === notaEsperada);

        document.querySelectorAll('.nota-btn').forEach(btn => {
            btn.classList.remove('destaque', 'acertou', 'errou');
            if (btn.dataset.nota === letraClicada) {
                btn.classList.add(acertou ? 'acertou' : 'errou');
            }
            if (btn.dataset.nota === notaEsperada && !acertou) {
                btn.classList.add('destaque');
                setTimeout(() => btn.classList.remove('destaque'), 1000);
            }
        });

        if (acertou) {
            acertos++;
            perguntaConcluida = true;
            feedbackMsg.textContent = `🎉 Parabéns! Você acertou: ${notaEsperadaObj.nome}!`;
            feedbackMsg.className = 'feedback sucesso';

            // Avançar automaticamente para a próxima etapa após 1 segundo
            setTimeout(() => {
                avançarEtapa();
            }, 1000);
        } else {
            erros++;
            feedbackMsg.textContent = `😢 Que pena! Você errou. A nota era ${notaEsperadaObj.nome}. Vamos tentar novamente!`;
            feedbackMsg.className = 'feedback erro';
            // Reinicia a etapa (toca a escala novamente, com nova pergunta aleatória)
            setTimeout(() => {
                document.querySelectorAll('.nota-btn').forEach(btn => btn.classList.remove('acertou', 'errou', 'destaque'));
                feedbackMsg.textContent = '';
                feedbackMsg.className = 'feedback';
                aguardandoResposta = false;
                estaTocando = false;
                if (!jogoTerminado && !perguntaConcluida) {
                    tocarEscala();
                }
            }, 1500);
        }
        atualizarInterface();
    }

    // ============================================================
    //  AVANÇAR ETAPA (substituto do antigo "Próximo")
    // ============================================================
    function avançarEtapa() {
        if (jogoTerminado) return;

        conjuntoIndex++;
        if (conjuntoIndex >= TOTAL_CONJUNTOS) {
            jogoTerminado = true;
            btnPlay.disabled = true;
            btnRepeat.disabled = true;
            desabilitarBotoes(true);
            feedbackMsg.textContent = `🏁 Fim! Acertos: ${acertos}, Erros: ${erros}`;
            feedbackMsg.className = 'feedback fim';
            return;
        }

        perguntaConcluida = false;
        aguardandoResposta = false;
        estaTocando = false;
        notaEsperada = null;
        notaEsperadaObj = null;
        btnPlay.disabled = false;
        btnRepeat.disabled = true;
        desabilitarBotoes(true);
        document.querySelectorAll('.nota-btn').forEach(btn => btn.classList.remove('acertou', 'errou', 'destaque'));
        feedbackMsg.textContent = '';
        feedbackMsg.className = 'feedback';
        desenharPartitura(-1);
        atualizarInterface();
    }

    // ============================================================
    //  EVENTOS
    // ============================================================
    btnPlay.addEventListener('click', () => {
        if (jogoTerminado || perguntaConcluida) return;
        if (aguardandoResposta || estaTocando) return;
        tocarEscala();
    });

    btnRepeat.addEventListener('click', repetirNota);

    // ============================================================
    //  INICIALIZAÇÃO
    // ============================================================
    function init() {
        if (typeof Vex === 'undefined') {
            setTimeout(init, 300);
            return;
        }
        desenharPartitura();
        atualizarInterface();
        feedbackMsg.textContent = '🎧 Clique em "Tocar" para começar';
        feedbackMsg.className = 'feedback info';
        console.log('✅ Teste carregado com ' + TOTAL_CONJUNTOS + ' conjuntos gerados.');
    }

    if (document.readyState === 'complete') {
        setTimeout(init, 400);
    } else {
        window.addEventListener('load', () => setTimeout(init, 400));
    }

    let resizeTimeout;
    window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
            if (!estaTocando && !aguardandoResposta) {
                desenharPartitura(notaDestaque);
            }
        }, 300);
    });
</script>
</body>
